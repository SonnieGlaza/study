[project]
name = "interior-telegram-bot"
version = "0.1.0"
description = "Telegram bot for interior recommendations, visualization and consulting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.8.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "sqlalchemy>=2.0.35",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "python-dotenv>=1.0.1",
  "reportlab>=4.2.0",
  "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
